<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    
    <!-- Core Stylesheets & Progressive Web App Manifest -->
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e1e">
</head>
<body>

    <!-- Main Viewport Layout: Two-Column Split Screen -->
    <div class="pokedex-layout">
        
        <!-- Left Panel: Detailed view of the selected Pokémon or search summary -->
        <section id="info-panel" class="info-panel hidden">
            <h2>Select or search for a single Pokémon</h2>
        </section>

        <!-- Right Panel: Search bar, filter toggles, and sortable data table -->
        <section class="list-panel">
            
            <!-- Search & Filter Controls -->
            <div class="search-container">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Search Pokémon...">
                    <button id="install-btn" class="install-button">Install App</button>
                </div>
                
                <!-- Filter Row: Search Field Toggles & Theme Switch -->
                <div class="filter-row">
                    <div class="checkbox-group">
                        <label class="toggle-label">
                            <input type="checkbox" name="search-field" value="number" checked>
                            <span class="slider"></span>
                            <span class="toggle-text">Number</span>
                        </label>
                        <label class="toggle-label">
                            <input type="checkbox" name="search-field" value="name" checked>
                            <span class="slider"></span>
                            <span class="toggle-text">Name</span>
                        </label>
                        <label class="toggle-label">
                            <input type="checkbox" name="search-field" value="type">
                            <span class="slider"></span>
                            <span class="toggle-text">Type</span>
                        </label>
                        <label class="toggle-label">
                            <input type="checkbox" name="search-field" value="description">
                            <span class="slider"></span>
                            <span class="toggle-text">Description</span>
                        </label>
                    </div>

                    <!-- Theme Preferences Toggle Switch -->
                    <div class="checkbox-group">
                        <label class="toggle-label">
                            <input type="checkbox" id="dark-mode-toggle" checked>
                            <span class="slider"></span>
                            <span class="toggle-text">Dark Mode</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Scrollable Pokémon Roster Table -->
            <div class="table-container">
                <table id="pokemon-table">
                    <thead>
                        <tr>
                            <th data-sort="id">Dex #</th>
                            <th class="col-sprite"> </th>
                            <th data-sort="name">Name</th>
                            <th data-sort="type">Type</th>
                            <th data-sort="height">Height</th>
                            <th data-sort="weight">Weight</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Dynamically populated via app.js -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Application Script Entry Point -->
    <script src="app.js"></script>
</body>
</html>
